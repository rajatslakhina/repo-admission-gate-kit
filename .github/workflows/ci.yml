name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift 6.1)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      # A clean build, because `swift build` on an up-to-date tree compiles
      # nothing and still prints "Build complete!".
      - name: Clean
        run: rm -rf .build

      # `-warnings-as-errors` makes the README's "zero warnings" claim
      # machine-enforced rather than asserted in prose.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  macos:
    name: macOS (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Clean
        run: rm -rf .build

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  ios-simulator:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `generic/platform=iOS Simulator`, never a named device: a compile-only
      # check needs no simulator runtime to be installed on the runner image.
      # No `-skipPackagePluginValidation` / `-skipMacroValidation` either: this
      # package has no plugins or macros, and those are exactly the flags the
      # library's command classifier reports as trust bypasses.
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme RepoAdmissionUI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
